name: Update news feed

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch headlines
        run: python scripts/update-news-feed.py

      - name: Commit feed if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update auto-fetched news headlines."
          file_pattern: content/news-feed.json
