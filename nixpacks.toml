# Force the Python provider at the repo root. Without this, Nixpacks sees
# index.html and misdetects the project as a static (nginx) site, so pip is
# never installed. Deps live in license-service/requirements.txt.
providers = ["python"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r license-service/requirements.txt",
]
